plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.0'
}

dependencies {
    // picocli
    implementation 'info.picocli:picocli:4.7.5'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.5'

    // jvm
    api project(path: ':jasm-composition-jvm')
    testImplementation(testFixtures(project(path: ':jasm-composition-jvm')))

    // dalvik
    api project(path: ':jasm-composition-dalvik')
    testImplementation(testFixtures(project(path: ':jasm-composition-dalvik')))
    testImplementation(testFixtures(project(path: ':jasm-core')))
}

shadowJar {
    archiveBaseName.set(project.name)
    archiveVersion.set(project.version)
    archiveClassifier.set('all')
    manifest {
        attributes 'Main-Class': 'me.darknet.assembler.cli.JasmCli'
    }
}

compileJava {
    options.compilerArgs += ["-Aproject=${project.group}/${project.name}"]
}