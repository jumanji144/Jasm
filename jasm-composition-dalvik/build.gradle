apply plugin: 'java-library'
apply plugin: 'java-test-fixtures'

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

dependencies {
    api 'com.github.jumanji144.dex:dex-core:f9353e0f33' // 'me.darknet:dex-core:0.0.4-alpha'

    api project(path: ':jasm-core')
    testFixturesApi 'com.github.jumanji144.dex:dex-core:f9353e0f33'
    testFixturesImplementation(testFixtures(project(path: ':jasm-core')))
    testFixturesImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    testImplementation(testFixtures(project(path: ':jasm-core')))
}

test {
    useJUnitPlatform()
}
