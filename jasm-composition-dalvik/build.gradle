apply plugin: 'java-library'

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

dependencies {
    api 'com.github.jumanji144.dex:dex-core:32b2dd05c1' // 'me.darknet:dex-core:0.0.2-alpha'

    api project(path: ':jasm-core')
    testImplementation(testFixtures(project(path: ':jasm-core')))
}

test {
    useJUnitPlatform()
}
